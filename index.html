<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="viewport-width, initial-scale=1.0">
        <title>Counters</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body> 
        <div class="container">
            <div class="header">
                <h1>Welcome to Words and Characters Counter</h1>
            </div>

            <p class="paragraph">Type something below and watch the counter update live.</p>
            <textarea id="notebox" rows="10" cols="40" placeholder="Type here..."></textarea>
            <div class="stats-row">
                <div class="counter">
                    <p>Words: <span id="wordCount">0</span></p>
                    <p>Characters: <span id="charCount">0</span></p>
                </div>
                <button id="clearBtn" class="Btn">Clear All</button>  
            </div>
            
        </div>

        <script src="main.js"></script>
    </body>
</html>
